<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Black Hole Berjalan</title>
    <style>
        /* Mengatur tampilan dasar layar */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Menyembunyikan scrollbar */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kontainer untuk gambar black hole */
        .black-hole-container {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            /* Memanggil gambar milikmu */
            background-image: url('2221967-4193067102.jpg');
            background-size: cover;
            background-position: center;
            
            /* Menerapkan animasi pergerakan distorsi ruang dan gas panas */
            animation: blackHoleMotion 8s infinite alternate ease-in-out;
        }

        /* Lapisan bayangan (vignette) yang berdenyut untuk efek mengerikan */
        .shadow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 90%);
            animation: pulseShadow 4s infinite alternate ease-in-out;
            pointer-events: none; /* Agar tidak mengganggu klik */
        }

        /* Keyframes untuk pergerakan Black Hole */
        @keyframes blackHoleMotion {
            0% {
                transform: scale(1) rotate(0deg);
                filter: contrast(1.1) brightness(0.9) hue-rotate(0deg);
            }
            50% {
                transform: scale(1.08) rotate(1.5deg);
                /* Gas terlihat lebih panas dan terang */
                filter: contrast(1.3) brightness(1.2) hue-rotate(8deg);
            }
            100% {
                transform: scale(1.03) rotate(-1deg);
                filter: contrast(1.15) brightness(0.8) hue-rotate(-4deg);
            }
        }

        /* Keyframes untuk efek denyutan bayangan */
        @keyframes pulseShadow {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Teks hiasan opsional di tengah (bisa dihapus jika tidak perlu) */
        .teks-tengah {
            position: relative;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            letter-spacing: 15px;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.8);
            z-index: 10;
            animation: textFloat 5s infinite alternate ease-in-out;
        }

        @keyframes textFloat {
            0% { transform: translateY(0px) scale(0.95); opacity: 0.5; }
            100% { transform: translateY(-10px) scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Gambar black hole yang dianimasikan -->
    <div class="black-hole-container"></div>
    
    <!-- Efek bayangan event horizon -->
    <div class="shadow-overlay"></div>

    <!-- Teks (Opsional) -->
    <h1 class="teks-tengah">SINGULARITY</h1>

</body>
</html>
